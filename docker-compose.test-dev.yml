name: devmail-test-dev

# e2e target #1: the dev image (source bind-mounted, `go run .`), built and
# run against hardcoded throwaway credentials so the suite needs no .env.
services:
  app:
    build:
      context: .
      target: dev
    environment:
      DEVMAIL_SMTP_USER: devmail-test
      DEVMAIL_SMTP_PASSWORD: devmail-test
      DEVMAIL_HTTP_PORT: 80
      DEVMAIL_SMTP_PORT: 465
    ports:
      - '8081:80'
      - '127.0.0.1:5466:465'
    volumes:
      - .:/app
