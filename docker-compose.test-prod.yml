name: devmail-test-prod

# e2e target #2: the prod image exactly as it would ship -- no bind mounts of
# any kind, so a bug that only exists in the prod build (e.g. something the
# dev stage's source mount happened to paper over) actually gets caught.
services:
  app:
    build:
      context: .
      target: prod
    environment:
      DEVMAIL_SMTP_USER: devmail-test
      DEVMAIL_SMTP_PASSWORD: devmail-test
      DEVMAIL_HTTP_PORT: 80
      DEVMAIL_SMTP_PORT: 465
    ports:
      - '8082:80'
      - '127.0.0.1:5467:465'
