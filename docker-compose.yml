name: devmail

# Dev stack: source bind-mounted, credentials from .env. No db service and no
# volumes -- devmail keeps messages in memory only.
services:
  app:
    build:
      context: .
      target: dev
    environment:
      DEVMAIL_SMTP_USER: ${DEVMAIL_SMTP_USER:?set DEVMAIL_SMTP_USER in .env (see .env.example)}
      DEVMAIL_SMTP_PASSWORD: ${DEVMAIL_SMTP_PASSWORD:?set DEVMAIL_SMTP_PASSWORD in .env (see .env.example)}
      DEVMAIL_HTTP_PORT: ${DEVMAIL_HTTP_PORT:-80}
      DEVMAIL_SMTP_PORT: ${DEVMAIL_SMTP_PORT:-465}
    ports:
      - '${HTTP_HOST_PORT:-8080}:${DEVMAIL_HTTP_PORT:-80}'
      # Loopback only: SMTPS carries plaintext-equivalent auth once
      # decrypted, and nothing outside this machine has any reason to reach
      # a dev mailtrap.
      - '127.0.0.1:${SMTP_HOST_PORT:-5465}:${DEVMAIL_SMTP_PORT:-465}'
    volumes:
      - .:/app
